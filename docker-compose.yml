version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: billing_pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billing_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zerocost_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-billing_db}
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_admin -d billing_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billing_jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-billing_admin}:${POSTGRES_PASSWORD:-zerocost_secure_pwd}@db:5432/${POSTGRES_DB:-billing_db}
      - PYTHONPATH=/workspace
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''

volumes:
  pgvector_data:
